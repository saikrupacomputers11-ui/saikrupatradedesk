<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Saikrupa Dashboard</title>
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

  <!-- Disclaimer Marquee -->
  <div class="bg-amber-600/20 text-amber-300 text-xs py-1 px-4 border-b border-amber-500/30 overflow-hidden whitespace-nowrap">
    <div class="inline-block animate-marquee">
      ⚠️ DISCLAIMER: We are NOT SEBI registered. All analysis on Nifty, Bank Nifty, and derivative stocks is strictly for educational purposes.
    </div>
  </div>

  <!-- Main Container -->
  <div class="container mx-auto p-4 md:p-6 space-y-6">

    <!-- Header Section -->
    <div class="flex justify-between items-center bg-gray-800/60 p-4 rounded-xl border border-gray-700">
      <h1 class="text-xl md:text-2xl font-bold text-blue-400">
        <i class="fa-solid fa-chart-line mr-2"></i>Saikrupa Investment Portfolio
      </h1>
      <span class="text-xs bg-green-500/20 text-green-400 px-3 py-1 rounded-full border border-green-500/30 font-semibold">
        Live Status
      </span>
    </div>

    <!-- Trade History Log Section with Month Filter -->
    <div class="glass p-5 rounded-xl border border-gray-700">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
        <h3 class="text-lg font-bold text-white flex items-center">
          <i class="fa-solid fa-history mr-2 text-blue-400"></i>
          Trade History Log (Only NIFTY-50)
        </h3>
        
        <!-- Month Filter Dropdown -->
        <div class="flex items-center space-x-2">
          <label for="monthFilter" class="text-xs text-gray-400 font-medium">Filter Month:</label>
          <select id="monthFilter" class="bg-gray-800 text-gray-200 border border-gray-700 text-xs rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer" onchange="filterTradesByMonth()">
            <option value="ALL">All Months</option>
            <option value="2026-01">January 2026</option>
            <option value="2026-02">February 2026</option>
            <option value="2026-03">March 2026</option>
            <option value="2026-04">April 2026</option>
            <option value="2026-05">May 2026</option>
            <option value="2026-06">June 2026</option>
            <option value="2026-07">July 2026</option>
            <option value="2026-08">August 2026</option>
          </select>
        </div>
      </div>

      <!-- Trade History Table -->
      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left text-gray-300">
          <thead class="text-xs uppercase bg-gray-800/80 text-gray-400 border-b border-gray-700">
            <tr>
              <th class="py-3 px-4">Date</th>
              <th class="py-3 px-4">Instrument</th>
              <th class="py-3 px-4">Type</th>
              <th class="py-3 px-4">Buy Price</th>
              <th class="py-3 px-4">Sell Price</th>
              <th class="py-3 px-4">P&L</th>
            </tr>
          </thead>
          <tbody id="tradeLogTableBody">
            <!-- Dynamic Trades Render Here -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // Sample Trade Data (Replace or Sync with your Google Visualization API response)
    let allTrades = [
      { date: "2026-08-10", instrument: "NIFTY 24500 CE", type: "BUY", buyPrice: 120, sellPrice: 145, pnl: "+2,500" },
      { date: "2026-08-05", instrument: "NIFTY 24400 PE", type: "BUY", buyPrice: 95, sellPrice: 80, pnl: "-1,500" },
      { date: "2026-07-20", instrument: "NIFTY 24200 CE", type: "BUY", buyPrice: 110, sellPrice: 150, pnl: "+4,000" },
      { date: "2026-06-15", instrument: "NIFTY 24000 CE", type: "BUY", buyPrice: 100, sellPrice: 130, pnl: "+3,000" }
    ];

    function renderTradeTable(trades) {
      const tbody = document.getElementById('tradeLogTableBody');
      tbody.innerHTML = '';

      if (trades.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-gray-500">No trades found for selected month.</td></tr>`;
        return;
      }

      trades.forEach(trade => {
        const isProfit = trade.pnl.startsWith('+');
        const pnlColor = isProfit ? 'text-green-400' : 'text-red-400';

        tbody.innerHTML += `
          <tr class="border-b border-gray-800 hover:bg-gray-800/40 transition">
            <td class="py-3 px-4">${trade.date}</td>
            <td class="py-3 px-4 font-semibold text-white">${trade.instrument}</td>
            <td class="py-3 px-4">${trade.type}</td>
            <td class="py-3 px-4">₹${trade.buyPrice}</td>
            <td class="py-3 px-4">₹${trade.sellPrice}</td>
            <td class="py-3 px-4 font-bold ${pnlColor}">${trade.pnl}</td>
          </tr>
        `;
      });
    }

    // Filter Logic Function
    function filterTradesByMonth() {
      const selectedMonth = document.getElementById('monthFilter').value;
      if (selectedMonth === 'ALL') {
        renderTradeTable(allTrades);
      } else {
        const filtered = allTrades.filter(trade => trade.date.startsWith(selectedMonth));
        renderTradeTable(filtered);
      }
    }

    // Initial Load
    document.addEventListener("DOMContentLoaded", () => {
      renderTradeTable(allTrades);
    });
  </script>
</body>
</html>
